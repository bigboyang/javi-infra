name: Build & Push Images

on:
  workflow_dispatch:
    inputs:
      service:
        description: 'Service to build (config-server | dashboard | all)'
        required: true
        default: 'all'
        type: choice
        options: [all, config-server, dashboard]
      tag:
        description: 'Image tag (e.g. v1.2.0). Defaults to short SHA.'
        required: false

  repository_dispatch:
    types: [build-config-server, build-dashboard]

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  # ─── config-server ────────────────────────────────────────────────────────
  build-config-server:
    name: Build javi-config-server
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'repository_dispatch' && github.event.action == 'build-config-server' ||
      github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'config-server')
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout javi-config-server
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OWNER }}/javi-config-server
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/javi-config-server
          tags: |
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,prefix=,format=short,enable=${{ inputs.tag == '' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── dashboard ────────────────────────────────────────────────────────────
  build-dashboard:
    name: Build javi-dashboard
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'repository_dispatch' && github.event.action == 'build-dashboard' ||
      github.event_name == 'workflow_dispatch' && (inputs.service == 'all' || inputs.service == 'dashboard')
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout javi-dashboard
        uses: actions/checkout@v4
        with:
          repository: ${{ env.OWNER }}/javi-dashboard
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/javi-dashboard
          tags: |
            type=raw,value=${{ inputs.tag }},enable=${{ inputs.tag != '' }}
            type=sha,prefix=,format=short,enable=${{ inputs.tag == '' }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── update kustomization image tags ──────────────────────────────────────
  update-image-tags:
    name: Update image tags in kustomization
    runs-on: ubuntu-latest
    needs: [build-config-server, build-dashboard]
    if: always() && (needs.build-config-server.result == 'success' || needs.build-dashboard.result == 'success')
    permissions:
      contents: write
    steps:
      - name: Checkout javi-infra
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Update config-server tag
        if: needs.build-config-server.result == 'success'
        working-directory: k8s/overlays/prod
        run: |
          kustomize edit set image \
            javi-config-server=${{ env.REGISTRY }}/${{ env.OWNER }}/javi-config-server:${{ needs.build-config-server.outputs.image_tag }}

      - name: Update dashboard tag
        if: needs.build-dashboard.result == 'success'
        working-directory: k8s/overlays/prod
        run: |
          kustomize edit set image \
            javi-dashboard=${{ env.REGISTRY }}/${{ env.OWNER }}/javi-dashboard:${{ needs.build-dashboard.outputs.image_tag }}

      - name: Commit updated tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml
          git diff --cached --quiet || git commit -m "chore: update image tags [skip ci]

          $([ '${{ needs.build-config-server.result }}' == 'success' ] && echo "- javi-config-server: ${{ needs.build-config-server.outputs.image_tag }}")
          $([ '${{ needs.build-dashboard.result }}' == 'success' ] && echo "- javi-dashboard: ${{ needs.build-dashboard.outputs.image_tag }}")"
          git push
