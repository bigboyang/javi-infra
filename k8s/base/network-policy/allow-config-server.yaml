apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-config-server
  namespace: apm
spec:
  podSelector:
    matchLabels:
      app: javi-config-server
  ingress:
    # Java agents poll config server via ingress-nginx
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 18888
          protocol: TCP
  policyTypes:
    - Ingress
