apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-collector
  namespace: apm
spec:
  podSelector:
    matchLabels:
      app: javi-collector
  ingress:
    # Java agents → OTLP ingest via ingress-nginx
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - port: 4317
          protocol: TCP
        - port: 4318
          protocol: TCP
  policyTypes:
    - Ingress
