apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Dev: single replicas, ephemeral storage, reduced resources
# Deploy: kubectl apply -k k8s/overlays/dev

namespace: apm

resources:
  - ../../base
  # Dev plaintext secrets (placeholder values — do NOT use real credentials)
  - secrets/clickhouse-secret.yaml
  - secrets/collector-secret.yaml
  - secrets/forecast-secret.yaml
  # Dev uses CPU-based HPA (no KEDA in dev) — collector/forecast HPAs are
  # inherited from base/kustomization.yaml; do not re-list them here.

# Pin image tags for reproducibility; override with real tags as needed
images:
  - name: javi-collector
    newTag: latest
  - name: javi-forecast
    newTag: latest
  - name: javi-dashboard
    newTag: latest
  - name: javi-config-server
    newTag: latest

patches:
  - path: patches/dev-collector.yaml
  - path: patches/dev-forecast.yaml
  - path: patches/dev-config-server.yaml
  - path: patches/dev-dashboard.yaml
  - path: patches/dev-redis.yaml
