apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Prod: 3-replica Kafka with persistent storage, scaled app replicas
# Deploy: kubectl apply -k k8s/overlays/prod

namespace: apm

resources:
  - ../../base
  # Sealed Secrets — encrypted by kubeseal, safe to commit.
  # Regenerate with: ./scripts/seal-secrets.sh
  - sealed-secrets/clickhouse-sealed-secret.yaml
  - sealed-secrets/collector-sealed-secret.yaml
  - sealed-secrets/forecast-sealed-secret.yaml
  # KEDA ScaledObjects — replace HPA (KEDA operator must be bootstrapped first)
  - scaledobject-forecast.yaml
  - scaledobject-collector.yaml

# CI pipeline injects IMAGE_TAG at build time. Replace vX.Y.Z before deploying.
images:
  - name: javi-collector
    newName: ghcr.io/bigboyang/javi-collector
    newTag: v1.0.0
  - name: javi-forecast
    newName: ghcr.io/bigboyang/javi-forecast
    newTag: v1.0.0
  - name: javi-dashboard
    newName: ghcr.io/bigboyang/javi-dashboard
    newTag: v1.0.0
  - name: javi-config-server
    newName: ghcr.io/bigboyang/javi-config-server
    newTag: v1.0.0

patches:
  # --- Kafka: scale to 3 replicas with persistent storage ---
  - target:
      group: kafka.strimzi.io
      version: v1beta2
      kind: KafkaNodePool
      name: combined
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
      - op: replace
        path: /spec/storage
        value:
          type: persistent-claim
          size: 20Gi
          deleteClaim: false
      - op: replace
        path: /spec/resources
        value:
          requests:
            memory: 2Gi
            cpu: "500m"
          limits:
            memory: 4Gi
            cpu: "2"

  # --- Kafka cluster: update replication factors for 3 brokers ---
  - target:
      group: kafka.strimzi.io
      version: v1beta2
      kind: Kafka
      name: apm-kafka
    patch: |
      - op: replace
        path: /spec/kafka/config
        value:
          offsets.topic.replication.factor: 3
          transaction.state.log.replication.factor: 3
          transaction.state.log.min.isr: 2
          default.replication.factor: 3
          min.insync.replicas: 2
          log.retention.hours: 168
          log.segment.bytes: 1073741824

  # --- Topics: replicas = 3 ---
  - target:
      group: kafka.strimzi.io
      version: v1beta2
      kind: KafkaTopic
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3

  # --- Collector: 2 replicas, prod resources ---
  - path: patches/collector-prod.yaml

  # --- Forecast: 2 replicas, prod resources ---
  - path: patches/forecast-prod.yaml

  # --- Dashboard: 2 replicas, prod resources ---
  - path: patches/dashboard-prod.yaml

  # --- Ingress: HTTPS + cert-manager Let's Encrypt ---
  # TODO: patches/ingress-tls.yaml의 yourdomain.com을 실제 도메인으로 교체 후 적용
  - path: patches/ingress-tls.yaml

  # --- Ollama: GPU 노드 배치 ---
  # TODO: GPU 노드에 accelerator=nvidia 레이블 필요: kubectl label node <node> accelerator=nvidia
  - path: patches/ollama-gpu.yaml

  # --- Redis HA: base 단일 Redis 비활성화 (Sentinel은 ArgoCD redis-ha-app으로 배포) ---
  - target:
      kind: Deployment
      name: redis
    patch: |
      - op: replace
        path: /spec/replicas
        value: 0

  # --- Forecast: Redis HA Sentinel 마스터 서비스로 REDIS_URL 오버라이드 ---
  # bitnami/redis Sentinel (redis-ha-app)의 마스터 서비스: redis-ha-redis-master:6379
  - target:
      kind: Deployment
      name: javi-forecast
    patch: |
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value:
          name: REDIS_URL
          value: "redis://redis-ha-redis-master:6379/0"

  # --- HPA 제거: prod는 KEDA ScaledObject로 스케일링하므로 base의 CPU HPA를 삭제 ---
  # (HPA + ScaledObject 동시 타겟 시 두 오토스케일러가 충돌. base HPA는 dev 전용)
  - target:
      kind: HorizontalPodAutoscaler
      name: javi-collector
    patch: |
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: javi-collector
  - target:
      kind: HorizontalPodAutoscaler
      name: javi-forecast
    patch: |
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: javi-forecast
