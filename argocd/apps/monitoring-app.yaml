# kube-prometheus-stack — Prometheus + Grafana + Alertmanager + node-exporter
# Chart 최신 버전 확인: https://artifacthub.io/packages/helm/prometheus-community/kube-prometheus-stack
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    # TODO: 배포 전 아래 명령으로 최신 버전 확인 후 고정
    # helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
    # helm search repo prometheus-community/kube-prometheus-stack
    targetRevision: "69.8.0"
    helm:
      valuesObject:
        prometheus:
          prometheusSpec:
            # ServiceMonitor/PodMonitor가 없어도 Helm 라벨 무관하게 수집
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            # prometheus.io/scrape: "true" 어노테이션 Pod 자동 수집
            additionalScrapeConfigs:
              - job_name: kubernetes-pods
                honor_labels: true
                kubernetes_sd_configs:
                  - role: pod
                relabel_configs:
                  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
                    action: keep
                    regex: "true"
                  - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
                    action: replace
                    target_label: __metrics_path__
                    regex: (.+)
                  - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
                    action: replace
                    regex: ([^:]+)(?::\d+)?;(\d+)
                    replacement: $1:$2
                    target_label: __address__
                  - action: labelmap
                    regex: __meta_kubernetes_pod_label_(.+)
                  - source_labels: [__meta_kubernetes_namespace]
                    action: replace
                    target_label: kubernetes_namespace
                  - source_labels: [__meta_kubernetes_pod_name]
                    action: replace
                    target_label: kubernetes_pod_name

        grafana:
          # 관리자 자격증명은 별도 Secret으로 관리 (SealedSecret 권장)
          # kubectl create secret generic grafana-admin-secret -n monitoring \
          #   --from-literal=admin-user=admin \
          #   --from-literal=admin-password=<strong-password>
          admin:
            existingSecret: grafana-admin-secret
            userKey: admin-user
            passwordKey: admin-password
          ingress:
            enabled: true
            ingressClassName: nginx
            annotations:
              cert-manager.io/cluster-issuer: letsencrypt-prod
              nginx.ingress.kubernetes.io/ssl-redirect: "true"
            # TODO: 실제 도메인으로 교체
            hosts:
              - grafana.apm.yourdomain.com
            tls:
              - secretName: grafana-tls
                hosts:
                  - grafana.apm.yourdomain.com
          # APM 대시보드 ConfigMap 자동 로드
          sidecar:
            dashboards:
              enabled: true
              label: grafana_dashboard

        alertmanager:
          alertmanagerSpec:
            replicas: 1

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
