apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apm-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/bigboyang/javi-infra.git
    targetRevision: main
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: apm
  syncPolicy:
    # Dev: 수동 sync (자동 prune으로 인한 의도치 않은 삭제 방지)
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
